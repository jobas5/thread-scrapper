<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 -apple-system, system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #111; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; margin: 6px 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #c33; }
  .dot.on { background: #2a8f4a; }
  label { display: block; margin-top: 10px; font-size: 12px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 10px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
  a { color: #0366d6; }
</style>
</head>
<body>
  <h1>Thread Scrapper Bridge</h1>
  <div class="row"><span><span id="dot" class="dot"></span>Server</span><span id="state">checking…</span></div>
  <div class="row"><span>Current job</span><span id="job">none</span></div>
  <label>Server URL<input id="server" placeholder="http://localhost:3000"></label>
  <button id="save">Save</button>
  <p><a id="open" href="#" target="_blank">Open web app</a></p>
  <script src="popup.js"></script>
</body>
</html>
